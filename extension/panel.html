<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동국대 AI Assistant</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;color:#182235;background:#fff}body{display:flex;flex-direction:column}header{height:86px;padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e8ebf0}.mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#152baf;color:#fff;font-weight:800}.title{font-size:17px;font-weight:750}.subtitle{font-size:13px;color:#798397;margin-top:3px}#messages{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}.message{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.55;font-size:14px;white-space:pre-wrap}.user{align-self:flex-end;background:#162daf;color:#fff;border-bottom-right-radius:4px}.assistant{align-self:flex-start;background:#f1f4f8;border-bottom-left-radius:4px}.welcome{color:#667085;font-size:14px;line-height:1.6}.welcome strong{display:block;color:#182235;font-size:18px;margin-bottom:6px}.detail{display:block;margin-top:8px;color:#64748b;font-size:12px}.action{display:block;margin-top:9px;padding:9px 10px;border:0;border-radius:9px;background:#fff;color:#1428a0;text-align:left;font-weight:700;cursor:pointer;box-shadow:0 0 0 1px #dbe1ef}.status{min-height:20px;padding:0 17px 7px;color:#6d7788;font-size:12px}.error{color:#c62828}form{padding:12px 14px 14px;border-top:1px solid #eef0f4;display:flex;gap:8px}textarea{flex:1;resize:none;border:1px solid #d8deea;border-radius:14px;padding:11px 12px;font:inherit;outline:none}textarea:focus{border-color:#162daf}button.send{width:42px;border:0;border-radius:50%;background:#162daf;color:#fff;font-size:19px;cursor:pointer}button:disabled{opacity:.45;cursor:default}footer{padding:0 18px 13px;text-align:right;color:#a0a8b6;font-size:11px}
  </style>
</head>
<body>
  <header><div class="mark">D</div><div><div class="title">동국대 AI Assistant</div><div class="subtitle">공식 정보 기반 안내</div></div></header>
  <main id="messages"><div class="welcome"><strong>무엇을 도와드릴까요?</strong>학사 안내와 nDRIMS 메뉴를 빠르게 찾아드릴게요.</div></main><div id="status" class="status"></div>
  <form id="chat-form"><textarea id="question" rows="1" maxlength="2000" placeholder="질문을 입력하세요"></textarea><button class="send" type="button" aria-label="보내기">↑</button></form><footer>AI 답변은 공식 출처를 확인해 주세요.</footer>
  <script>
    window.addEventListener("error",event=>{const notice=document.getElementById("status");if(notice)notice.textContent=`화면 오류: ${event.message}`});
    const API="http://127.0.0.1:8000/api/chat/stream/extension/",messages=document.getElementById("messages"),form=document.getElementById("chat-form"),question=document.getElementById("question"),status=document.getElementById("status"),send=form.querySelector("button"),key="dgu-extension-session";let extensionSession;try{extensionSession=localStorage.getItem(key)||crypto?.randomUUID?.()||`extension-${Date.now()}-${Math.random()}`;localStorage.setItem(key,extensionSession)}catch{extensionSession=`extension-${Date.now()}-${Math.random()}`}let sessionId=null;
    const add=(text,role)=>{const node=document.createElement("div");node.className=`message ${role}`;node.textContent=text;messages.append(node);messages.scrollTop=messages.scrollHeight;return node},setStatus=(text,failed=false)=>{status.textContent=text;status.classList.toggle("error",failed)};
    const addAction=(data,answer)=>{if(data.action_type!=="navigate_ndrims_menu")return;const button=document.createElement("button");button.className="action";button.textContent=`바로가기 열기 · ${data.label}`;button.addEventListener("click",()=>{setStatus("nDRIMS 메뉴를 여는 중…");chrome.runtime.sendMessage({type:"DGU_NDRIMS_ACTION",action_id:data.action_id,label:data.label},result=>setStatus(result?.reason||(result?.opened?"메뉴를 열었습니다.":"메뉴를 열지 못했습니다."),!result?.opened))});answer.append(button)};
    async function ask(text){const value=text.trim();if(!value)return;question.value="";send.disabled=true;setStatus("답변을 준비하고 있어요…");add(value,"user");const answer=add("","assistant");try{const response=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-DGU-Extension-Session":extensionSession},body:JSON.stringify({message:value,session_id:sessionId})});if(!response.ok||!response.body)throw new Error("서버에 연결하지 못했습니다.");const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const {value:chunk,done}=await reader.read();if(done)break;buffer+=decoder.decode(chunk,{stream:true});const end=buffer.lastIndexOf("\n\n");if(end<0)continue;const blocks=buffer.slice(0,end).split("\n\n");buffer=buffer.slice(end+2);for(const block of blocks){const event=block.match(/^event:\s*(.+)$/m)?.[1],raw=block.match(/^data:\s*(.+)$/m)?.[1];if(!event||!raw)continue;const data=JSON.parse(raw);if(event==="session")sessionId=data.session_id;if(event==="answer")answer.textContent=data.text;if(event==="source"){const source=document.createElement("span");source.className="detail";source.textContent=`출처: ${data.title}`;answer.append(source)}if(event==="action")addAction(data,answer);if(event==="error")throw new Error(data.message||"요청을 처리하지 못했습니다.")}}if(!answer.textContent.trim())answer.textContent="답변을 찾지 못했습니다.";setStatus("")}catch(error){answer.textContent="요청을 처리하지 못했습니다.";setStatus(error.message||"연결이 끊겼습니다.",true)}finally{send.disabled=false;messages.scrollTop=messages.scrollHeight}}
    form.addEventListener("submit",event=>{event.preventDefault();ask(question.value)});send.addEventListener("click",()=>ask(question.value));
  </script>
</body>
</html>
