<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동국대 AI Assistant</title>
  <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}body{background:#fff}</style>
</head>
<body>
  <iframe id="assistant-frame" title="동국대 AI Assistant" src="http://localhost:3000/embed"></iframe>
  <script>
    const assistantFrame = document.getElementById("assistant-frame");
    window.addEventListener("message", (event) => {
      if (event.data?.type !== "DGU_NDRIMS_ACTION") return;
      chrome.runtime.sendMessage(event.data, (result) => {
        assistantFrame.contentWindow.postMessage({ type: "DGU_NDRIMS_ACTION_RESULT", ...result }, "*");
      });
    });
  </script>
</body>
</html>
